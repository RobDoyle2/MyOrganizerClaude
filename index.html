<meta name="theme-color" content="#2347d6">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap">
<style>
:root{--bg:#eceff3;--card:#fff;--ink:#16212c;--mut:#6b7785;--line:#dde2e8;--acc:#2347d6;--accx:#fff;--wk:#e6edfb;--r:14px;
font-family:system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--card:#1b222a;--ink:#e8edf2;--mut:#8f9ba8;--line:#2b343e;--acc:#8fa5ff;--accx:#0c1220;--wk:#1a2538;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171d;--card:#1b222a;--ink:#e8edf2;--mut:#8f9ba8;--line:#2b343e;--acc:#8fa5ff;--accx:#0c1220;--wk:#1a2538;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}body{background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;padding-bottom:84px}
h1,h2,h3,.big{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}
h1{font-size:24px}header p{margin:0;color:var(--mut);font-size:13px}
main{padding:6px 14px 20px;max-width:640px;margin:0 auto}
h3{font-size:16px;margin:18px 2px 8px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.ib{font-size:20px;padding:8px;border-radius:50%}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.mut,small{color:var(--mut);font-size:12.5px}
.btn{background:var(--acc);color:var(--accx);padding:11px 16px;border-radius:10px;font-weight:600;width:100%;margin-top:8px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}.btn.danger{color:#d23b3b}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;padding:9px 0 8px;font-size:11.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px}
nav button span{font-size:19px}nav button.on{color:var(--acc);font-weight:600}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:var(--acc);color:var(--accx);font-size:28px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:6}
.wk7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:4px 0 10px}
.dy{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:1px}
.dy small{font-size:11px}.dy b{font-family:"Bricolage Grotesque",sans-serif;font-size:17px}.dy i{font-style:normal;font-size:10.5px;color:var(--mut)}
.dy.on{background:var(--acc);color:var(--accx);border-color:var(--acc)}.dy.on small,.dy.on i{color:var(--accx);opacity:.85}.dy.td b{text-decoration:underline}
.dh{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 8px}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--wk);color:var(--acc);font-weight:600}
.hr{display:grid;grid-template-columns:46px 1fr 30px;gap:6px;padding:7px 8px;border-bottom:1px solid var(--line);min-height:46px;align-items:start}
.hrs{background:var(--card);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.hr:last-child{border-bottom:0}.hr.wk{background:var(--wk)}.hr.now{box-shadow:inset 3px 0 0 var(--acc)}
.hl{font-size:12.5px;color:var(--mut);padding-top:5px}.ad{color:var(--mut);font-size:20px;opacity:.6}
.it{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:8px 10px;margin:2px 0 4px}
.hr .it{background:var(--bg)}.hr.wk .it{background:var(--card)}
.ck{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--c);color:var(--accx);font-weight:700;font-size:14px;line-height:1;display:grid;place-items:center}
.it.dn .ck{background:var(--c)}.it.dn .tx b{text-decoration:line-through;color:var(--mut);font-weight:500}
.tx{flex:1;min-width:0;cursor:pointer}.tx b{display:block;font-weight:600;overflow-wrap:anywhere}.tx small{display:block}
.ov{position:fixed;inset:0;background:rgba(10,15,22,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}.ov[hidden]{display:none}
.sh{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.hd h2{font-size:19px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:4px 0 8px}
textarea{min-height:70px;resize:vertical}label{display:block;font-size:12.5px;color:var(--mut)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row>.btn{margin-top:4px}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.cc{border:2px solid var(--c);border-radius:99px;padding:4px 11px;font-size:13px}.cc.on{background:var(--c);color:#fff;font-weight:600}
.ring{display:flex;align-items:center;gap:16px}.ring svg{flex:none}.big{font-size:30px}
.bars{display:flex;gap:6px;align-items:flex-end;height:90px}.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
.bar{width:100%;background:var(--line);border-radius:6px;position:relative;overflow:hidden}.bar i{position:absolute;left:0;right:0;bottom:0;background:var(--acc)}
.cb{margin:9px 0}.cb div{display:flex;justify-content:space-between;font-size:13px}.cb .tr{height:8px;background:var(--line);border-radius:6px;margin-top:3px;overflow:hidden}.cb .tr i{display:block;height:100%;background:var(--c)}
.dots{display:flex;gap:4px;margin-top:4px}.dots i{width:9px;height:9px;border-radius:50%;border:2px solid var(--c)}.dots i.f{background:var(--c)}
.lg{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.lg:last-child{border:0}.lg>span:first-child{width:22px;text-align:center}.lg>div{flex:1}
#pops{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:40;display:flex;flex-direction:column;gap:8px;max-width:560px;margin:0 auto}
.pop{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.35)}
