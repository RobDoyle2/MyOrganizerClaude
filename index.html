<style>

.pop b{display:block;font-size:16px}.pop .row{grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}

.tagadd{display:flex;gap:6px}.tagadd .btn{width:auto;margin:4px 0 8px;white-space:nowrap}.faces{display:flex;gap:8px;margin-top:10px}.faces button{flex:1;font-size:26px;padding:8px 0;border-radius:12px;border:2px solid var(--line);opacity:.7}.faces button.on{border-color:var(--acc);background:var(--wk);opacity:1}.bh{display:flex;gap:12px;align-items:center;margin-bottom:8px}.bh b{display:block}.bh .lt{font-family:"Bricolage Grotesque",sans-serif;font-size:34px;width:40px;text-align:center;color:var(--acc);line-height:1}.rts{display:flex;gap:6px}.rt{flex:1;padding:8px 0;border-radius:10px;border:1px solid var(--line);font-weight:600;color:var(--mut)}.rt.on{background:var(--acc);color:var(--accx);border-color:var(--acc)}.bl textarea{min-height:50px;margin:8px 0 0}
nav button{font-size:10.5px}nav button span{font-size:18px}.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}.seg button{flex:1;padding:7px;border-radius:9px}.seg button.on{background:var(--acc);color:var(--accx);font-weight:600}.it.old,.hr .it.old,.hr.wk .it.old{background:color-mix(in srgb,#e0a21a 22%,var(--card));border-color:#e0a21a;border-left-color:var(--c)}.ib.pp{font-size:16px;padding:2px 4px;opacity:.75}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;z-index:50;max-width:90%;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
nav button{text-align:center;line-height:1.15}
body[data-v=dash]{--bg:#e9eef5}body[data-v=plan]{--bg:#e7f2ec}body[data-v=rout]{--bg:#f0ecf8}body[data-v=goals]{--bg:#fbf0e3}body[data-v=rev]{--bg:#e5f1f4}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) body[data-v=dash]{--bg:#121820}:root:not([data-theme="light"]) body[data-v=plan]{--bg:#0f1c18}:root:not([data-theme="light"]) body[data-v=rout]{--bg:#181427}:root:not([data-theme="light"]) body[data-v=goals]{--bg:#201810}:root:not([data-theme="light"]) body[data-v=rev]{--bg:#0e1b20}}
:root[data-theme="dark"] body[data-v=dash]{--bg:#121820}:root[data-theme="dark"] body[data-v=plan]{--bg:#0f1c18}:root[data-theme="dark"] body[data-v=rout]{--bg:#181427}:root[data-theme="dark"] body[data-v=goals]{--bg:#201810}:root[data-theme="dark"] body[data-v=rev]{--bg:#0e1b20}
.it.cont{border-style:dashed;border-left-style:solid;padding:5px 10px}.it.cont,.hr .it.cont,.hr.wk .it.cont{background:color-mix(in srgb,var(--c) 14%,var(--card))}a.lk{color:var(--acc);text-decoration:underline;word-break:break-all}
body[data-v=ideas]{--bg:#fbf5dc;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2072%27%3E%3Cg%20fill%3D%27%23f2c94c%27%20fill-opacity%3D%27.16%27%20stroke%3D%27%23d9a227%27%20stroke-opacity%3D%27.38%27%20stroke-width%3D%272.4%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%3E%3Cpath%20d%3D%27M32%208a19%2019%200%200%200-10.5%2034.8c2.2%201.6%203.4%203.8%203.4%206.4v1.8h14.2v-1.8c0-2.6%201.2-4.8%203.4-6.4A19%2019%200%200%200%2032%208z%27%2F%3E%3Cpath%20d%3D%27M25%2056h14M27.5%2062h9%27%20fill%3D%27none%27%2F%3E%3Cpath%20d%3D%27M32%201v3M10%209l2.2%202.2M54%209l-2.2%202.2M3%2028h3M58%2028h3%27%20fill%3D%27none%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");background-repeat:no-repeat;background-position:center 55%;background-size:min(78vw,340px);background-attachment:fixed}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) body[data-v=ideas]{--bg:#1c190e}}
:root[data-theme="dark"] body[data-v=ideas]{--bg:#1c190e}
.idea-box{background:color-mix(in srgb,var(--card) 72%,transparent)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style></head><body>
<header><div><h1>My Organizer</h1><p id="sub"></p></div><span><button class="ib" data-act="data" aria-label="Data and backup">💾</button><button class="ib" id="bell" data-act="bell" aria-label="Enable notifications">🔔</button></span></header>
<main id="app"></main>
<button class="fab" data-act="add" aria-label="Add task">+</button>
<nav><button data-act="v" data-v="plan"><span>🗓️</span>Planner (tasks)</button><button data-act="v" data-v="rout"><span>🔁</span>Routines</button><button data-act="v" data-v="goals"><span>🎯</span>Goals</button><button data-act="v" data-v="ideas"><span>💡</span>Ideas</button><button data-act="v" data-v="rev"><span>🌙</span>Review</button></nav>
<div id="md" class="ov" hidden></div><div id="pops"></div>
<script>
const CATS={family:['Family','#e0663f'],health:['Health','#2f9d62'],career:['Career and Purpose','#3d5a9e'],friends:['Friendships','#8e5fc4'],rest:['Rest','#1a95ad']};
const PDESC={family:'father and husband',health:'mind, body and spirit',career:'work and professional development',friends:'personal development and social',rest:'time to recover'};
const DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],DS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>{d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)};const T=()=>ymd(new Date());
let S=null;try{S=JSON.parse(localStorage.getItem('org1'))}catch(e){}
if(!S){S={tasks:[],routines:[],rdone:{},log:[],fired:{},snz:{}};const t=T();
S.routines.push({id:uid(),title:'Morning walk',details:'20 minutes, no phone',cat:'health',freq:'daily',time:'06:30',remind:10,start:t},
{id:uid(),title:'Plan the day',details:'Top 3 priorities',cat:'career',freq:'workday',time:'08:00',remind:0,start:t},
{id:uid(),title:'Weekly review',details:'What worked, what next week?',cat:'career',freq:'weekly',dow:0,time:'18:00',remind:15,start:t})}
let FH=null,wt;
const fix=d=>{d=Object.assign({tasks:[],routines:[],rdone:{},log:[],fired:{},snz:{},rev:{},goals:[],ideas:[],ctags:[]},d);mig(d);return d};
const persist=()=>{try{localStorage.setItem('org1',JSON.stringify(S))}catch(e){}if(FH){clearTimeout(wt);wt=setTimeout(wr,400)}};
S.rev=S.rev||{};S.goals=S.goals||[];S.ideas=S.ideas||[];S.ctags=S.ctags||[];const PMAP={work:'career',mind:'health',physical:'health',personal:'friends',professional:'career'},norm=k=>{const l=String(k).toLowerCase();if(PMAP[l])return PMAP[l];const p=Object.entries(CATS).find(([x,[n]])=>x===l||n.toLowerCase()===l);return p?p[0]:k},mig=d=>{[...d.tasks,...d.routines,...d.log].forEach(o=>{o.tags=[...new Set((o.tags||(o.cat?[o.cat]:[])).map(norm))];delete o.cat});d.ctags=[...new Set((d.ctags||[]).map(norm))].filter(k=>!CATS[k])};mig(S);persist();
const TG=k=>CATS[k]||[k,'hsl('+([...k].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7))+',55%,42%)'];
const tags=o=>o.tags||(o.cat?[o.cat]:[]),col=o=>{const t=tags(o)[0];return t?TG(t)[1]:'#8a94a0'};
const mday=(ds,n)=>{const d=pd(ds);return d.getDate()===Math.min(n||1,new Date(d.getFullYear(),d.getMonth()+1,0).getDate())};
function addTag(){const i=$('#f-tag');if(!i||!ed)return;let t=i.value.trim();if(!t)return;const l=t.toLowerCase(),p=Object.entries(CATS).find(([k,[n]])=>k===l||n.toLowerCase()===l);if(p)t=p[0];else{const x=S.ctags.find(c=>c.toLowerCase()===l);if(x)t=x;else S.ctags.push(t)}if(!ed.tags.includes(t))ed.tags.push(t);i.value='';$('#cats').innerHTML=chips(ed.tags);persist()}
let view='rev',sel=T(),ed=null,delArm=false,lt=[],rd=T(),gl='week',gp=T(),rvm='over',rp=T(),im='new';
const LV={week:'Weekly',month:'Monthly',quarter:'Quarterly'},PN={1:'High',2:'Medium',3:'Low'},PD={1:'🔴',2:'🟡',3:'🟢'};
const pKey=(l,ds)=>{const d=pd(ds);if(l==='week'){d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)}if(l==='month')return ds.slice(0,7);return d.getFullYear()+'-Q'+(Math.floor(d.getMonth()/3)+1)};
const goalOf=id=>S.goals.find(g=>g.id===id),fmtD=s=>pd(s).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
const LVO={week:0,month:1,quarter:2};
const pStart=(l,p)=>l==='week'?p:l==='month'?p+'-01':p.slice(0,4)+'-'+pad((+p.slice(-1)-1)*3+1)+'-01';
const plab=(l,p)=>l==='week'?'Week of '+pd(p).toLocaleDateString(undefined,{day:'numeric',month:'short'}):l==='month'?pd(p+'-01').toLocaleDateString(undefined,{month:'short',year:'numeric'}):'Q'+p.slice(-1)+' '+p.slice(0,4);
const pRange=(l,p)=>{const s=pStart(l,p),a=pd(s),e=new Date(a);if(l==='week')e.setDate(a.getDate()+6);else e.setMonth(a.getMonth()+(l==='month'?1:3),0);return[s,ymd(e)]};
const inside=(par,c)=>{const[a,b]=pRange(par.level,par.period),s=pStart(c.level,c.period);return s>=a&&s<=b};
const gprog=g=>{const K=S.goals.filter(c=>c.parent===g.id);if(K.length){const ps=K.map(gprog);return{t:K.length,d:ps.filter(x=>x.p===100).length,p:g.done?100:Math.round(ps.reduce((a,x)=>a+x.p,0)/K.length),u:'goals'}}const L=S.tasks.filter(t=>t.goal===g.id),d=L.filter(t=>t.done).length;return{t:L.length,d,p:L.length?Math.round(d/L.length*100):(g.done?100:0),u:'tasks'}};
const kids=g=>S.goals.filter(c=>c.parent===g.id).sort((a,b)=>LVO[b.level]-LVO[a.level]||a.period.localeCompare(b.period)).map(c=>`<div class='tx' data-act='eg' data-id='${c.id}' style='margin-top:6px'><small>${LV[c.level]}, ${plab(c.level,c.period)}</small>${gbar(c)}</div>`).join('');
const gbtns=g=>{const b=(a,t,x='')=>`<button class='btn ghost' data-act='${a}' data-id='${g.id}' ${x}>${t}</button>`;return `<div class='row'>${g.level==='week'?b('gt','New task')+b('lk','Add existing tasks'):(g.level==='quarter'?b('cg','New monthly goal','data-l="month"')+b('cg','New weekly goal','data-l="week"'):b('cg','New weekly goal','data-l="week"'))+b('lg','Add existing goals')}</div>`};
function openPick(kind,id){const g=goalOf(id);ed={pick:kind,goal:id};let L;
if(kind==='task')L=S.tasks.filter(t=>!t.done&&t.goal!==id).sort((a,b)=>(a.goal?1:0)-(b.goal?1:0)||(a.date||'0').localeCompare(b.date||'0')).slice(0,80).map(t=>[t.id,t.title,[t.date?fmtD(t.date):'Backlog',t.goal&&goalOf(t.goal)?'now in '+goalOf(t.goal).title:'',t.est?fmtEst(t.est):''].filter(Boolean).join(', ')]);
else L=S.goals.filter(c=>LVO[c.level]<LVO[g.level]&&c.parent!==id&&inside(g,c)).sort((a,b)=>(a.parent?1:0)-(b.parent?1:0)||a.period.localeCompare(b.period)).map(c=>[c.id,c.title,LV[c.level]+', '+plab(c.level,c.period)+(c.parent&&goalOf(c.parent)?', now in '+goalOf(c.parent).title:'')]);
$('#md').innerHTML=`<div class='sh'><div class='hd'><h2>${kind==='task'?'Add existing tasks':'Add existing goals'}</h2><button class='ib' data-act='close' aria-label='Close'>✕</button></div><small>${esc(g.title)}</small>${L.length?L.map(([i,t,m])=>`<label style='display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);color:var(--ink);font-size:15px'><input type='checkbox' data-pick='${i}' style='width:auto;margin:3px 0 0'><span>${esc(t)}<br><small>${esc(m)}</small></span></label>`).join(''):`<p class='mut'>Nothing to add yet.</p>`}${L.length?`<button class='btn' data-act='pk'>Add selected</button>`:''}</div>`;$('#md').hidden=false}
const gbar=g=>{const p=gprog(g);return `<div class='cb' style='--c:${tags(g).length?col(g):'var(--acc)'}'><div><span>${PD[g.prio||2]} ${esc(g.title)}</span><span>${p.t?p.d+'/'+p.t+', ':''}${p.p}%</span></div><div class='tr'><i style='width:${p.p}%'></i></div></div>`};
const fmtEst=m=>m<60?m+' min':(m/60)+'h';
const ageT=t=>{if(t.done)return 0;const s=t.created||t.date;return s?Math.round((pd(T())-pd(s))/864e5):0};
const tI=t=>({k:'t',id:t.id,key:t.id+'|'+t.date,...t});
const endT=(t,e)=>{const m=+t.slice(0,2)*60+ +t.slice(3,5)+e;return pad(Math.floor(m/60)%24)+':'+pad(m%60)};

${r&&o.k==='t'?ppBlock(r):''}<button class="btn" data-act="sv">Save</button>${r?'<button class="btn ghost danger" data-act="del">Delete</button>':''}</div>`;

function popup(it,ds){const el=document.createElement('div');el.className='pop';el.style.setProperty('--c',col(it));
el.innerHTML=`<b>⏰ ${esc(it.title)}</b><small>Starts at ${it.time}${tags(it).length?', '+tags(it).map(x=>esc(TG(x)[0])).join(' + '):''}</small><div class="row"><button data-act="pdone" ${A(it,ds)}>Done</button><button data-act="snz" data-key="${it.key}">Snooze 10 min</button><button data-act="pdis">Dismiss</button></div>`;

case'bell':try{Notification.requestPermission().then(p=>{b.textContent=p==='granted'?'🔔':'🔕';beep()})}catch(x){beep()}break}});

const cnt=()=>S.tasks.length+' tasks, '+S.routines.length+' routines, '+S.goals.length+' goals, '+Object.keys(S.rev).length+' reviews';

document.addEventListener('change',e=>{if(e.target.id!=='imp')return;const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d||!Array.isArray(d.tasks))throw 0;S=fix(d);persist();closeEd();render();toast('Imported: '+cnt())}catch(x){toast('That file could not be read')}})});
setInterval(chk,15000);setInterval(()=>{if(view==='plan'&&!ed)render()},300000);render();chk();
